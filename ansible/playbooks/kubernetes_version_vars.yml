---
# The desired Kubernetes minor release for installation and upgrades.
# Update this single value for the next supported one-minor-at-a-time upgrade.
kubernetes_version_minor: "1.36"
kubernetes_version_package: "1.36.3-1.1"

kubernetes_upgrade_diagnostics_enabled: true
kubernetes_upgrade_recovery_diagnostics_enabled: false

# The etcd certificates predate the current control-plane address. Repair only
# these local serving certificates before attempting the Kubernetes upgrade.
kubernetes_etcd_endpoint_repair_enabled: true
