# Public WordPress hosts for the OllyVape brands.
upstream ollyvape_wordpress_upstreams {
  least_conn;
  keepalive 32;
  server k-worker-01.lab:30625 max_fails=2 fail_timeout=10s;
  server k-worker-02.lab:30625 max_fails=2 fail_timeout=10s;
}

upstream edibellini_wordpress_upstreams {
  least_conn;
  keepalive 32;
  server k-worker-01.lab:30626 max_fails=2 fail_timeout=10s;
  server k-worker-02.lab:30626 max_fails=2 fail_timeout=10s;
}

server {
    listen 443 ssl;
    include snippets/certs.conf;
    include /etc/nginx/allow-cloudflare-only.conf;
    server_name ollyvape.nl www.ollyvape.nl ollyvape.uneat.space;
    client_max_body_size 80M;

    location / {
        proxy_pass http://ollyvape_wordpress_upstreams;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}

server {
    listen 443 ssl;
    include snippets/certs.conf;
    include /etc/nginx/allow-cloudflare-only.conf;
    server_name edibellini.nl www.edibellini.nl edibellini.uneat.space;
    client_max_body_size 64M;

    location / {
        proxy_pass http://edibellini_wordpress_upstreams;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
