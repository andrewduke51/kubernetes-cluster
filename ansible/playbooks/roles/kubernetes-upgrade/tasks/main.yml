---
- name: Validate Kubernetes upgrade inventory groups
  ansible.builtin.assert:
    that:
      - kubernetes_version_minor is defined
      - kubernetes_version_minor is match('^[0-9]+\\.[0-9]+$')
      - kubernetes_version_package is defined
      - kubernetes_version_package is match('^' ~ kubernetes_version_minor ~ '\\.[0-9]+-[0-9]+\\.[0-9]+$')
      - groups[kubernetes_upgrade_cluster_group] | default([]) | length > 0
      - groups[kubernetes_upgrade_control_plane_group] | default([]) | length == 1
      - groups[kubernetes_upgrade_control_plane_group][0] in groups[kubernetes_upgrade_cluster_group]
    fail_msg: >-
      The upgrade role requires exactly one control-plane host in the
      '{{ kubernetes_upgrade_control_plane_group }}' group and all nodes in
      '{{ kubernetes_upgrade_cluster_group }}'.
  run_once: true

- name: Derive the only supported source minor version
  ansible.builtin.set_fact:
    kubernetes_upgrade_previous_minor: "{{ kubernetes_version_minor.split('.')[0] }}.{{ (kubernetes_version_minor.split('.')[1] | int) - 1 }}"
  run_once: true

- name: Read Kubernetes node versions from the API server
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} get nodes
  delegate_to: "{{ groups[kubernetes_upgrade_control_plane_group][0] }}"
  register: kubernetes_upgrade_api_node_versions
  changed_when: false
  run_once: true

- name: Report Kubernetes node versions from the API server
  ansible.builtin.debug:
    var: kubernetes_upgrade_api_node_versions.stdout_lines
  run_once: true

- name: Read kubelet version from every cluster node
  ansible.builtin.command: kubelet --version
  delegate_to: "{{ item }}"
  loop: "{{ groups[kubernetes_upgrade_cluster_group] }}"
  register: kubernetes_upgrade_node_versions
  changed_when: false
  run_once: true

- name: Determine whether every node already matches the requested minor
  ansible.builtin.set_fact:
    kubernetes_upgrade_already_current: >-
      {{ kubernetes_upgrade_node_versions.results
         | rejectattr('stdout', 'search',
             'Kubernetes v' ~ kubernetes_version_minor ~ '\.')
         | list | length == 0 }}
  run_once: true

- name: Determine whether every node is exactly one minor behind the requested version
  ansible.builtin.set_fact:
    kubernetes_upgrade_needed: >-
      {{ kubernetes_upgrade_node_versions.results
         | rejectattr('stdout', 'search',
             'Kubernetes v' ~ kubernetes_upgrade_previous_minor ~ '\.')
         | list | length == 0 }}
  run_once: true

- name: Determine whether the requested version is not a safe automatic upgrade
  ansible.builtin.set_fact:
    kubernetes_upgrade_unsupported_state: >-
      {{ not kubernetes_upgrade_already_current | bool
         and not kubernetes_upgrade_needed | bool }}
  run_once: true

- name: Report that the cluster already matches the target minor
  ansible.builtin.debug:
    msg: >-
      Kubernetes is already {{ kubernetes_version_minor }}.x on every
      node; no upgrade actions were taken.
  when: kubernetes_upgrade_already_current | bool
  run_once: true

- name: Report that the requested version is not a safe automatic upgrade
  ansible.builtin.debug:
    msg: >-
      No upgrade actions were taken. Every node must be either already on
      {{ kubernetes_version_minor }}.x, or all nodes must be exactly one minor
      behind on {{ kubernetes_upgrade_previous_minor }}.x. This protects against
      downgrades, skipped minor versions, and mixed-version clusters.
  when: kubernetes_upgrade_unsupported_state | bool
  run_once: true

- name: Verify control-plane certificate prerequisites before upgrade
  ansible.builtin.include_tasks: preflight.yml
  when:
    - kubernetes_upgrade_needed | bool
  run_once: true

- name: Upgrade the control plane before worker nodes
  block:
    - name: Upgrade the control-plane node
      ansible.builtin.include_tasks: control-plane.yml

  rescue:
    - name: Uncordon the control-plane node after an upgrade failure
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} uncordon
        {{ groups[kubernetes_upgrade_control_plane_group][0] }}
      delegate_to: "{{ groups[kubernetes_upgrade_control_plane_group][0] }}"
      changed_when: true

    - name: Stop before worker upgrades after a control-plane failure
      ansible.builtin.fail:
        msg: >-
          The control-plane upgrade failed and the control-plane node was
          uncordoned. Worker upgrades were not attempted.

  when:
    - kubernetes_upgrade_needed | bool
    - >-
      kubernetes_upgrade_node_versions.results
      | selectattr('item', 'equalto', groups[kubernetes_upgrade_control_plane_group][0])
      | map(attribute='stdout') | first
      is not search('Kubernetes v' ~ kubernetes_version_minor ~ '\.')
  run_once: true

- name: Upgrade worker nodes serially
  ansible.builtin.include_tasks: worker.yml
  loop: "{{ groups[kubernetes_upgrade_cluster_group] | reject('in', groups[kubernetes_upgrade_control_plane_group]) | list }}"
  loop_control:
    loop_var: kubernetes_upgrade_worker
  when:
    - kubernetes_upgrade_needed | bool
    - >-
      kubernetes_upgrade_node_versions.results
      | selectattr('item', 'equalto', kubernetes_upgrade_worker)
      | map(attribute='stdout') | first
      is not search('Kubernetes v' ~ kubernetes_version_minor ~ '\.')
  run_once: true
