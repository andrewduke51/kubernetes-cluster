---
- name: Set the control-plane upgrade host
  ansible.builtin.set_fact:
    kubernetes_upgrade_target_host: "{{ groups[kubernetes_upgrade_control_plane_group][0] }}"

- name: Ensure the control-plane inventory IP is assigned to its host
  ansible.builtin.assert:
    that:
      - >-
        hostvars[kubernetes_upgrade_target_host].ansible_host
        in hostvars[kubernetes_upgrade_target_host].ansible_all_ipv4_addresses
    fail_msg: >-
      Refusing the upgrade because the inventory control-plane IP
      {{ hostvars[kubernetes_upgrade_target_host].ansible_host }} is not assigned
      to {{ kubernetes_upgrade_target_host }}.

- name: Cordon the control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} cordon
    {{ kubernetes_upgrade_target_host }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: true

- name: Drain the control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} drain
    {{ kubernetes_upgrade_target_host }} --ignore-daemonsets --delete-emptydir-data
    --timeout={{ kubernetes_upgrade_drain_timeout }}
    {{ '--force' if kubernetes_upgrade_drain_force | bool else '' }}
    {{ '--disable-eviction' if kubernetes_upgrade_drain_disable_eviction | bool else '' }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: true

- name: Configure the target Kubernetes repository on the control plane
  ansible.builtin.include_tasks: repository.yml

- name: Unhold kubeadm on the control plane
  ansible.builtin.command: apt-mark unhold kubeadm
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Install pinned kubeadm {{ kubernetes_version_package }} on the control plane
  ansible.builtin.apt:
    name: "kubeadm={{ kubernetes_version_package }}"
    state: present
  delegate_to: "{{ kubernetes_upgrade_target_host }}"

- name: Hold kubeadm on the control plane
  ansible.builtin.command: apt-mark hold kubeadm
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Read the installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  register: kubernetes_upgrade_kubeadm_version
  changed_when: false

- name: Check the control-plane upgrade plan
  ansible.builtin.command: kubeadm upgrade plan
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Read the live kubeadm ClusterConfiguration
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }}
    -n kube-system get configmap kubeadm-config
    -o jsonpath={.data.ClusterConfiguration}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  register: kubernetes_upgrade_live_cluster_configuration
  changed_when: false

- name: Write kubeadm upgrade configuration with the current control-plane endpoint
  ansible.builtin.copy:
    dest: "{{ kubernetes_upgrade_kubeadm_config }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: {{ hostvars[kubernetes_upgrade_target_host].ansible_host }}
        bindPort: 6443
      nodeRegistration:
        name: {{ kubernetes_upgrade_target_host }}
      ---
      {{ kubernetes_upgrade_live_cluster_configuration.stdout
         | regex_replace('(?m)^kubernetesVersion:.*$', 'kubernetesVersion: v' ~ kubernetes_version_package.split('-')[0]) }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"

- name: Apply the control-plane upgrade
  ansible.builtin.command: >-
    kubeadm upgrade apply --yes --config {{ kubernetes_upgrade_kubeadm_config }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"

- name: Unhold kubelet and kubectl on the control plane
  ansible.builtin.command: apt-mark unhold kubelet kubectl
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Install pinned kubelet and kubectl {{ kubernetes_version_package }} on the control plane
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version_package }}"
      - "kubectl={{ kubernetes_version_package }}"
    state: present
  delegate_to: "{{ kubernetes_upgrade_target_host }}"

- name: Hold kubelet and kubectl on the control plane
  ansible.builtin.command: apt-mark hold kubelet kubectl
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Restart kubelet on the control plane
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  delegate_to: "{{ kubernetes_upgrade_target_host }}"

- name: Wait for the control-plane node to become Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} wait
    --for=condition=Ready node/{{ kubernetes_upgrade_target_host }}
    --timeout={{ kubernetes_upgrade_ready_timeout }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: false

- name: Uncordon the control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubernetes_upgrade_kubeconfig }} uncordon
    {{ kubernetes_upgrade_target_host }}
  delegate_to: "{{ kubernetes_upgrade_target_host }}"
  changed_when: true
