---
kubernetes_upgrade_cluster_group: kubernetescluster
kubernetes_upgrade_control_plane_group: master
kubernetes_upgrade_kubeconfig: /etc/kubernetes/admin.conf
kubernetes_upgrade_keyring_path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
kubernetes_upgrade_repo_file: kubernetes

# This is a home-lab upgrade role: services may be unavailable while their
# node is upgraded. Force permits unmanaged pods; disable_eviction bypasses
# PDBs, so a PDB cannot block the planned maintenance window.
kubernetes_upgrade_drain_timeout: 20m
kubernetes_upgrade_drain_force: true
kubernetes_upgrade_drain_disable_eviction: true
kubernetes_upgrade_ready_timeout: 10m
